<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock in</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<nav class="sidebar" id="sb" aria-label="Main"></nav>
<main class="main" id="content">
  <div class="topbar">
    <button class="btn btn-outline-secondary d-lg-none" aria-label="Open menu" onclick="sb.classList.toggle('open')"><i class="bi bi-list"></i></button>
    <h1 class="h4 mb-0">Stock in (receive products)</h1><span id="who" class="text-muted small"></span>
  </div>
  <div id="denied" class="alert alert-warning d-none" role="alert">You do not have permission to receive stock. Ask the owner to enable it.</div>
  <div class="row g-3" id="wrap">
    <div class="col-lg-5"><form class="panel" id="f" novalidate>
      <div class="mb-3"><label class="form-label" for="prod">Product *</label><select id="prod" class="form-select" required></select></div>
      <div class="row g-3 mb-3">
        <div class="col-6"><label class="form-label" for="qty">Packs received *</label><input id="qty" type="number" min="1" step="1" class="form-control" required></div>
        <div class="col-6"><label class="form-label" for="cost">Cost per pack (₦) *</label><input id="cost" type="number" min="0" step="0.01" class="form-control" required></div>
      </div>
      <div class="alert alert-secondary py-2" id="preview" aria-live="polite">Choose a product and enter a quantity.</div>
      <div class="row g-3 mb-3">
        <div class="col-6"><label class="form-label" for="date">Date received</label><input id="date" type="date" class="form-control"></div>
        <div class="col-6"><label class="form-label" for="ref">Invoice / reference</label><input id="ref" class="form-control"></div>
      </div>
      <div class="mb-3" id="supWrap"><label class="form-label" for="sup">Supplier</label><select id="sup" class="form-select"><option value="">None</option></select></div>
      <div class="mb-3"><label class="form-label" for="notes">Notes</label><textarea id="notes" class="form-control" rows="2"></textarea></div>
      <button class="btn btn-brand w-100" id="save">Receive stock</button>
    </form></div>
    <div class="col-lg-7"><div class="panel"><h2 class="h6">Recent deliveries</h2><div class="table-responsive"><table class="table table-sm align-middle mb-0">
      <caption class="visually-hidden">Recent stock received</caption>
      <thead><tr><th>Date</th><th>Product</th><th class="text-end">Packs</th><th>Reference</th></tr></thead><tbody id="recent"></tbody></table></div></div></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/utils.js"></script><script src="js/layout.js"></script>
<script>
const $ = id => document.getElementById(id); let me, prods = [], key = crypto.randomUUID();
const stamp = d => new Intl.DateTimeFormat("en-GB", { timeZone: "Africa/Lagos", dateStyle: "short", timeStyle: "short" }).format(new Date(d));
function preview() {
  const p = prods.find(x => x.id == $("prod").value), q = parseInt($("qty").value);
  $("preview").textContent = p && q > 0 ? p.name + ": " + num(p.current_stock) + " packs now, " + num(p.current_stock + q) + " packs after this delivery." : "Choose a product and enter a quantity.";
}
async function recent() {
  const { data } = await db.from("inventory_history").select("*").eq("type", "stock_received").order("created_at", { ascending: false }).limit(10);
  $("recent").innerHTML = (data || []).map(r => "<tr><td>" + stamp(r.created_at) + "</td><td>" + esc(r.product_name) + '</td><td class="text-end">+' + num(r.qty_change) + "</td><td>" + esc(r.reference || "—") + "</td></tr>").join("") || '<tr><td colspan="4" class="text-muted">No deliveries recorded yet.</td></tr>';
}
async function loadProducts() {
  const { data } = await db.from("products_status").select("id,name,sku,current_stock,purchase_price").eq("is_archived", false).order("name"); prods = data || [];
  $("prod").innerHTML = '<option value="">Select product</option>' + prods.map(p => '<option value="' + p.id + '">' + esc(p.name) + " (" + esc(p.sku) + ")</option>").join("");
}
$("prod").addEventListener("change", () => { const p = prods.find(x => x.id == $("prod").value); if (p && p.purchase_price != null) $("cost").value = p.purchase_price; preview(); });
$("qty").addEventListener("input", preview);
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  if (!$("prod").value) return toast("Choose a product.", "error");
  if (!(parseInt($("qty").value) > 0)) return toast("Enter at least 1 pack.", "error");
  if ($("cost").value === "" || +$("cost").value < 0) return toast("Enter the cost per pack.", "error");
  $("save").disabled = true;
  const { error } = await db.rpc("receive_stock", { p_product_id: +$("prod").value, p_qty: parseInt($("qty").value), p_unit_cost: +$("cost").value,
    p_supplier_id: $("sup").value ? +$("sup").value : null, p_received_on: $("date").value || null, p_reference: $("ref").value.trim() || null, p_notes: $("notes").value.trim() || null, p_client_key: key });
  $("save").disabled = false;
  if (error) return toast(error.message, "error");
  toast("Stock received. Inventory updated."); key = crypto.randomUUID(); $("f").reset(); $("date").value = today; preview(); await loadProducts(); recent();
});
const today = new Intl.DateTimeFormat("en-CA", { timeZone: "Africa/Lagos" }).format(new Date());
(async () => {
  me = await requireAuth(); if (!me) return; renderShell("stockin", me); $("date").value = today;
  if (me.role === "staff") {
    const { data } = await db.from("staff_permissions").select("can_receive_stock").eq("user_id", me.id).single();
    if (!data || !data.can_receive_stock) { $("denied").classList.remove("d-none"); $("wrap").classList.add("d-none"); return; }
    $("supWrap").classList.add("d-none");
  } else {
    const s = await db.from("suppliers").select("id,name").order("name");
    $("sup").innerHTML += (s.data || []).map(x => '<option value="' + x.id + '">' + esc(x.name) + "</option>").join("");
  }
  await loadProducts(); recent();
})();
</script>
</body>
</html>

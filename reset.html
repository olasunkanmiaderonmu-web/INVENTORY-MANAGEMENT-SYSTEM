<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<div class="login-wrap">
  <div class="login-side"><h1>Choose a new password.</h1><p class="mb-0 opacity-75">Use at least 8 characters.</p></div>
  <div class="login-form"><div style="width:100%;max-width:360px">
    <div id="msg" class="alert d-none" role="alert"></div>
    <form id="f" class="d-none">
      <h2 class="h4 mb-3">New password</h2>
      <label class="form-label" for="pw">New password</label><input id="pw" type="password" minlength="8" class="form-control mb-3" autocomplete="new-password" required>
      <label class="form-label" for="pw2">Type it again</label><input id="pw2" type="password" minlength="8" class="form-control mb-3" autocomplete="new-password" required>
      <button id="btn" class="btn btn-brand w-100">Save new password</button>
    </form>
    <p class="mt-3 mb-0"><a href="index.html">Back to sign in</a></p>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="auth.js"></script>
<script>
const $ = id => document.getElementById(id), hash = location.hash, wasRecovery = /type=recovery/.test(hash);
let shown = false;
const show = (t, ok) => { $("msg").textContent = t; $("msg").className = "alert " + (ok ? "alert-success" : "alert-danger"); };
function ready() { shown = true; $("msg").classList.add("d-none"); $("f").classList.remove("d-none"); }
if (/error/.test(hash)) { shown = true; show("This reset link has expired or was already used. Go back to sign in and click Forgot your password again."); }
else if (!configured) { shown = true; show("Supabase is not connected. Check js/config.js."); }
else {
  db.auth.onAuthStateChange((ev) => { if (ev === "PASSWORD_RECOVERY" || (ev === "SIGNED_IN" && wasRecovery)) ready(); });
  setTimeout(() => { if (!shown) { shown = true; show("Could not verify this link. Open it again from the email, or request a new one from the sign-in page."); } }, 4000);
}
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  if ($("pw").value.length < 8) return show("The password must be at least 8 characters.");
  if ($("pw").value !== $("pw2").value) return show("The two passwords do not match.");
  $("btn").disabled = true;
  const { error } = await db.auth.updateUser({ password: $("pw").value });
  if (error) { $("btn").disabled = false; return show(error.message); }
  await db.auth.signOut(); $("f").classList.add("d-none"); show("Password changed. You can now sign in with the new password.", true);
});
</script>
</body>
</html>

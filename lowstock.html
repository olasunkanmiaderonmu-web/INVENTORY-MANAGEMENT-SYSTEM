<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Low stock</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<nav class="sidebar" id="sb" aria-label="Main"></nav>
<main class="main" id="content">
  <div class="topbar">
    <button class="btn btn-outline-secondary d-lg-none" aria-label="Open menu" onclick="sb.classList.toggle('open')"><i class="bi bi-list"></i></button>
    <h1 class="h4 mb-0">Low stock and out of stock</h1><span id="who" class="text-muted small"></span>
  </div>
  <div class="panel"><div class="table-responsive"><table class="table align-middle mb-0">
    <caption class="visually-hidden">Products that need restocking</caption>
    <thead><tr><th>Product</th><th class="text-end">Packs left</th><th class="text-end">Low-stock level</th><th class="text-end">Packs short</th><th>Status</th></tr></thead>
    <tbody id="rows"></tbody></table></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/utils.js"></script><script src="js/layout.js"></script>
<script>
(async () => {
  const me = await requireAuth(); if (!me) return; renderShell("lowstock", me);
  const { data, error } = await db.from("products_status").select("*").eq("is_archived", false).neq("status", "ok").order("current_stock");
  if (error) return toast(error.message, "error");
  document.getElementById("rows").innerHTML = data.map(r => "<tr><td class='fw-semibold'>" + esc(r.name) + "</td><td class='text-end'>" + num(r.current_stock) + "</td><td class='text-end'>" + num(r.min_stock) + "</td><td class='text-end'>" + num(Math.max(0, r.min_stock - r.current_stock)) + "</td><td>" + statusBadge(r.status) + "</td></tr>").join("")
    || '<tr><td colspan="5" class="text-center text-muted py-4">Nothing is running low. Every product is above its low-stock level.</td></tr>';
})();
</script>
</body>
</html>

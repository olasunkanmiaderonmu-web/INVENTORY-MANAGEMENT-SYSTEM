<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock history</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<nav class="sidebar" id="sb" aria-label="Main"></nav>
<main class="main" id="content">
  <div class="topbar">
    <button class="btn btn-outline-secondary d-lg-none" aria-label="Open menu" onclick="sb.classList.toggle('open')"><i class="bi bi-list"></i></button>
    <h1 class="h4 mb-0">Stock movement history</h1><span id="who" class="text-muted small"></span>
  </div>
  <div class="panel mb-3"><div class="row g-2">
    <div class="col-md-5"><label class="form-label small" for="fp">Product</label><select id="fp" class="form-select"><option value="">All products</option></select></div>
    <div class="col-md-4"><label class="form-label small" for="ft">Type</label><select id="ft" class="form-select"><option value="">All types</option></select></div>
  </div></div>
  <div class="panel"><div class="table-responsive"><table class="table table-sm align-middle">
    <caption class="visually-hidden">Every stock movement, newest first</caption>
    <thead><tr><th>Date and time</th><th>Product</th><th>Type</th><th class="text-end">Before</th><th class="text-end">Change</th><th class="text-end">After</th><th>By</th><th>Reference / notes</th></tr></thead>
    <tbody id="rows"></tbody></table></div>
    <div class="d-flex justify-content-between align-items-center"><span class="small text-muted" id="count"></span>
    <div class="btn-group"><button class="btn btn-outline-secondary btn-sm" id="prev">Previous</button><button class="btn btn-outline-secondary btn-sm" id="next">Next</button></div></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="auth.js"></script><script src="utils.js"></script><script src="layout.js"></script>
<script>
const $ = id => document.getElementById(id), PAGE = 15; let page = 0;
const TYPES = { opening_stock: "Opening stock", stock_received: "Stock received", sale: "Sale", customer_return: "Customer return", damaged: "Damaged stock", expired: "Expired stock", adjustment: "Stock adjustment", sale_reversal: "Sale reversal" };
const stamp = d => new Intl.DateTimeFormat("en-GB", { timeZone: "Africa/Lagos", dateStyle: "short", timeStyle: "short" }).format(new Date(d));
async function load() {
  let q = db.from("inventory_history").select("*", { count: "exact" });
  if ($("fp").value) q = q.eq("product_id", $("fp").value); if ($("ft").value) q = q.eq("type", $("ft").value);
  const { data, count, error } = await q.order("created_at", { ascending: false }).range(page * PAGE, page * PAGE + PAGE - 1);
  if (error) return toast(error.message, "error");
  $("rows").innerHTML = data.map(r => "<tr><td>" + stamp(r.created_at) + "</td><td>" + esc(r.product_name) + "</td><td>" + esc(TYPES[r.type] || r.type) + '</td><td class="text-end">' + num(r.prev_qty) +
    '</td><td class="text-end fw-semibold ' + (r.qty_change < 0 ? "text-danger" : "text-success") + '">' + (r.qty_change > 0 ? "+" : "") + num(r.qty_change) + '</td><td class="text-end">' + num(r.new_qty) +
    "</td><td>" + esc(r.user_name || "—") + "</td><td>" + esc([r.reference, r.notes].filter(Boolean).join(" · ") || "—") + "</td></tr>").join("") || '<tr><td colspan="8" class="text-center text-muted py-4">No movements yet.</td></tr>';
  $("count").textContent = count ? "Showing " + (page * PAGE + 1) + "-" + Math.min((page + 1) * PAGE, count) + " of " + count : "";
  $("prev").disabled = page === 0; $("next").disabled = (page + 1) * PAGE >= count;
}
const reload = () => { page = 0; load(); };
$("fp").onchange = $("ft").onchange = reload; $("prev").onclick = () => { page--; load(); }; $("next").onclick = () => { page++; load(); };
(async () => {
  const me = await requireAuth(); if (!me) return; renderShell("history", me);
  $("ft").innerHTML += Object.entries(TYPES).map(([k, v]) => '<option value="' + k + '">' + v + "</option>").join("");
  const p = await db.from("products_status").select("id,name").order("name");
  $("fp").innerHTML += (p.data || []).map(x => '<option value="' + x.id + '">' + esc(x.name) + "</option>").join(""); load();
})();
</script>
</body>
</html>

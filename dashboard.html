<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>

<body>
  <nav class="sidebar" id="sb"></nav>
  <main class="main">
    <div class="topbar">
      <button class="btn btn-outline-secondary d-lg-none" onclick="sb.classList.toggle('open')"><i
          class="bi bi-list"></i></button>
      <h1 class="h4 mb-0">Dashboard</h1><span id="who" class="text-muted small"></span>
    </div>
    <div class="row g-3 mb-4" id="cards">
      <div class="col-12 text-muted">Loading...</div>
    </div>
    <div class="row g-3">
      <div class="col-lg-5">
        <div class="panel">
          <h2 class="h6">Stock by category (packs)</h2><canvas id="chart" height="220"></canvas>
          <p id="nochart" class="text-muted small d-none mb-0">No stock yet. Add products to see this chart.</p>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="panel">
          <h2 class="h6">Needs restocking</h2>
          <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
              <thead>
                <tr>
                  <th>Product</th>
                  <th class="text-end">Left (packs)</th>
                  <th class="text-end">Minimum</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="low"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div class="panel mt-3">
      <h2 class="h6">Recent stock activity</h2>
      <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
          <caption class="visually-hidden">Latest stock movements</caption>
          <thead>
            <tr>
              <th>Date</th>
              <th>Product</th>
              <th>Type</th>
              <th class="text-end">Change</th>
            </tr>
          </thead>
          <tbody id="recent"></tbody>
        </table>
      </div>
    </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="utils.js"></script>
  <script src="layout.js"></script>
  <script>
    (async () => {
      const p = await requireAuth(); if (!p) return;
      renderShell("dashboard", p);
      const { data, error } = await db.from("products_status").select("*").eq("is_archived", false);
      if (error) { document.getElementById("cards").innerHTML = '<div class="col-12"><div class="alert alert-danger">Could not load data: ' + esc(error.message) + ". Did you run 02_phase2.sql?</div></div>"; return; }
      db.from("inventory_history").select("*").order("created_at", { ascending: false }).limit(6).then(({ data }) => { document.getElementById("recent").innerHTML = (data || []).map(r => "<tr><td>" + fmtDate(r.created_at) + "</td><td>" + esc(r.product_name) + "</td><td>" + esc(r.type.replace(/_/g, " ")) + '</td><td class="text-end">' + (r.qty_change > 0 ? "+" : "") + num(r.qty_change) + "</td></tr>").join("") || '<tr><td colspan="4" class="text-muted">No stock activity yet.</td></tr>'; });
      const sum = f => data.reduce((a, r) => a + f(r), 0);
      const low = data.filter(r => r.status !== "ok").sort((a, b) => a.current_stock - b.current_stock);
      const cards = [
        ["Products", num(data.length), "box-seam", ""],
        ["Packs in stock", num(sum(r => r.current_stock)), "stack", ""],
        ["Low stock", num(data.filter(r => r.status === "low").length), "exclamation-triangle", "warn"],
        ["Out of stock", num(data.filter(r => r.status === "out").length), "x-octagon", "bad"]
      ];
      /*     if (p.role === "owner") cards.splice(2, 0,
            ["Inventory cost value", naira(sum(r => r.current_stock * (r.purchase_price || 0))), "wallet2", ""],
            ["Potential sales value", naira(sum(r => r.current_stock * r.selling_price)), "graph-up-arrow", ""]);
               if (p.role === "owner") {
        const d = new Intl.DateTimeFormat("en-CA", { timeZone: "Africa/Lagos" }).format(new Date());
        const { data: sl } = await db.from("sales_list").select("total,sale_date").eq("status", "completed").gte("sale_date", d.slice(0, 8) + "01");
        const sr = sl || [];
        cards.push(["Sales today", naira(sr.filter(r => r.sale_date === d).reduce((a, r) => a + r.total, 0)), "cash-stack", ""],
                   ["Sales this month", naira(sr.reduce((a, r) => a + r.total, 0)), "calendar-month", ""]);
      }; */

      const todayStr = new Intl.DateTimeFormat("en-CA", { timeZone: "Africa/Lagos" }).format(new Date());
      const monthStr = todayStr.slice(0, 7) + "-01";
      const sv = await db.from("sales_view").select("sale_date,total,qty,unit_cost").eq("status", "completed").gte("sale_date", monthStr);
      const sd = sv.data || [];
      const salesToday = sd.filter(r => r.sale_date === todayStr).reduce((a, r) => a + Number(r.total), 0);
      const salesMonth = sd.reduce((a, r) => a + Number(r.total), 0);
      cards.unshift(["Sales today", naira(salesToday), "cash-stack", ""], ["Sales this month", naira(salesMonth), "calendar-check", ""]);
      if (p.role === "owner") cards.push(["Gross profit this month", naira(sd.reduce((a, r) => a + Number(r.total) - r.qty * Number(r.unit_cost || 0), 0)), "piggy-bank", ""]);

      if (p.role === "owner") { const cb = await db.from("customer_balances").select("balance"); cards.push(["Customers owe you", naira((cb.data || []).reduce((a, r) => a + Math.max(0, Number(r.balance)), 0)), "people", "warn"]); }


      if (p.role === "owner") {
        const ex = await db.from("expenses").select("amount").eq("is_void", false).gte("expense_date", monthStr);
        const exTotal = (ex.data || []).reduce((a, r) => a + Number(r.amount), 0);
        const gross = sd.reduce((a, r) => a + Number(r.total) - r.qty * Number(r.unit_cost || 0), 0);
        cards.push(["Expenses this month", naira(exTotal), "receipt", "warn"], ["Net profit this month", naira(gross - exTotal), "piggy-bank", gross - exTotal < 0 ? "bad" : ""]);
      }


      document.getElementById("cards").innerHTML = cards.map(c =>
        '<div class="col-6 col-xl-4"><div class="stat ' + c[3] + '"><i class="bi bi-' + c[2] + '"></i><div><div class="stat-label">' + c[0] + '</div><div class="stat-value">' + c[1] + "</div></div></div></div>").join("");
      document.getElementById("low").innerHTML = low.length ? low.map(r =>
        "<tr><td>" + esc(r.name) + '</td><td class="text-end">' + num(r.current_stock) + '</td><td class="text-end">' + num(r.min_stock) + "</td><td>" + statusBadge(r.status) + "</td></tr>").join("")
        : '<tr><td colspan="4" class="text-muted">Nothing is running low.</td></tr>';
      const by = {}; data.forEach(r => by[r.category_name || "Uncategorised"] = (by[r.category_name || "Uncategorised"] || 0) + r.current_stock);
      const labels = Object.keys(by).filter(k => by[k] > 0);
      if (!labels.length) { document.getElementById("chart").classList.add("d-none"); document.getElementById("nochart").classList.remove("d-none"); return; }
      new Chart(document.getElementById("chart"), { type: "doughnut", data: { labels, datasets: [{ data: labels.map(k => by[k]), backgroundColor: ["#333333", "#FF6700", "#f2b705", "#8c8c8c", "#ffb27a", "#b3261e"] }] }, options: { plugins: { legend: { position: "bottom" } } } });
    })();
  </script>
</body>

</html>

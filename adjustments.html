<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock adjustments</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<nav class="sidebar" id="sb" aria-label="Main"></nav>
<main class="main" id="content">
  <div class="topbar">
    <button class="btn btn-outline-secondary d-lg-none" aria-label="Open menu" onclick="sb.classList.toggle('open')"><i class="bi bi-list"></i></button>
    <h1 class="h4 mb-0">Stock adjustments</h1><span id="who" class="text-muted small"></span>
  </div>
  <div class="row g-3">
    <div class="col-lg-5"><form class="panel" id="f" novalidate>
      <div class="mb-3"><label class="form-label" for="prod">Product *</label><select id="prod" class="form-select" required></select></div>
      <div class="mb-3"><label class="form-label" for="kind">What happened? *</label><select id="kind" class="form-select"></select></div>
      <div class="mb-3"><label class="form-label" for="qty" id="qtyL">Packs *</label><input id="qty" type="number" min="0" step="1" class="form-control" required></div>
      <div class="alert alert-secondary py-2" id="preview" aria-live="polite">Choose a product and enter a quantity.</div>
      <div class="mb-3"><label class="form-label" for="reason">Reason *</label><textarea id="reason" class="form-control" rows="2" required placeholder="e.g. Crate fell during offloading"></textarea></div>
      <button class="btn btn-brand w-100" id="save">Record adjustment</button>
      <p class="small text-muted mt-2 mb-0">A customer return here only adds stock back. To cancel a sale, use Reverse sale on the Sales page.</p>
    </form></div>
    <div class="col-lg-7"><div class="panel"><h2 class="h6">Recent adjustments</h2><div class="table-responsive"><table class="table table-sm align-middle mb-0">
      <caption class="visually-hidden">Recent stock adjustments</caption>
      <thead><tr><th>Date</th><th>Product</th><th>Type</th><th class="text-end">Change</th><th>Reason</th></tr></thead><tbody id="recent"></tbody></table></div></div></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/utils.js"></script><script src="js/layout.js"></script>
<script>
const $ = id => document.getElementById(id); let prods = [], key = crypto.randomUUID();
const KINDS = { damaged: "Damaged stock", expired: "Expired stock", missing: "Missing stock", customer_return: "Customer return (adds stock)", count_correction: "Physical stock count correction" };
const TYPES = { damaged: "Damaged", expired: "Expired", adjustment: "Adjustment", customer_return: "Customer return" };
const stamp = d => new Intl.DateTimeFormat("en-GB", { timeZone: "Africa/Lagos", dateStyle: "short", timeStyle: "short" }).format(new Date(d));
function preview() {
  const p = prods.find(x => x.id == $("prod").value), q = parseInt($("qty").value), k = $("kind").value;
  $("qtyL").textContent = k === "count_correction" ? "Packs counted on the shelf *" : "Packs *";
  if (!p || isNaN(q)) { $("preview").textContent = "Choose a product and enter a quantity."; return; }
  const after = k === "count_correction" ? q : k === "customer_return" ? p.current_stock + q : p.current_stock - q;
  $("preview").textContent = p.name + ": " + num(p.current_stock) + " packs now, " + num(after) + " after this adjustment." + (after < 0 ? " That is below zero and will be refused." : "");
}
async function loadProducts() {
  const { data } = await db.from("products_status").select("id,name,sku,current_stock").eq("is_archived", false).order("name"); prods = data || [];
  $("prod").innerHTML = '<option value="">Select product</option>' + prods.map(p => '<option value="' + p.id + '">' + esc(p.name) + " (" + num(p.current_stock) + " left)</option>").join("");
}
async function recent() {
  const { data } = await db.from("inventory_history").select("*").in("type", ["damaged", "expired", "adjustment", "customer_return"]).order("created_at", { ascending: false }).limit(15);
  $("recent").innerHTML = (data || []).map(r => "<tr><td>" + stamp(r.created_at) + "</td><td>" + esc(r.product_name) + "</td><td>" + esc(TYPES[r.type]) + '</td><td class="text-end fw-semibold ' + (r.qty_change < 0 ? "text-danger" : "text-success") + '">' + (r.qty_change > 0 ? "+" : "") + num(r.qty_change) + "</td><td>" + esc(r.notes || "—") + "</td></tr>").join("") || '<tr><td colspan="5" class="text-muted">No adjustments yet.</td></tr>';
}
["prod", "kind"].forEach(i => $(i).addEventListener("change", preview)); $("qty").addEventListener("input", preview);
$("f").addEventListener("submit", async e => {
  e.preventDefault(); const p = prods.find(x => x.id == $("prod").value), q = parseInt($("qty").value);
  if (!p) return toast("Choose a product.", "error");
  if (isNaN(q) || q < 0) return toast("Enter the quantity.", "error");
  if ($("reason").value.trim().length < 3) return toast("A reason is required.", "error");
  if (!confirm("Record this adjustment for " + p.name + "? It cannot be edited afterwards.")) return;
  $("save").disabled = true;
  const { error } = await db.rpc("adjust_stock", { p_product_id: p.id, p_kind: $("kind").value, p_qty: q, p_reason: $("reason").value.trim(), p_client_key: key });
  $("save").disabled = false;
  if (error) return toast(error.message, "error");
  toast("Adjustment recorded."); key = crypto.randomUUID(); $("f").reset(); preview(); await loadProducts(); recent();
});
(async () => {
  const me = await requireAuth("owner"); if (!me) return; renderShell("adjust", me);
  $("kind").innerHTML = Object.entries(KINDS).map(([k, v]) => '<option value="' + k + '">' + v + "</option>").join("");
  await loadProducts(); recent();
})();
</script>
</body>
</html>

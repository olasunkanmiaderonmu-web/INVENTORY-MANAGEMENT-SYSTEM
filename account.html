<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<nav class="sidebar" id="sb" aria-label="Main"></nav>
<main class="main" id="content">
  <div class="topbar">
    <button class="btn btn-outline-secondary d-lg-none" aria-label="Open menu" onclick="sb.classList.toggle('open')"><i class="bi bi-list"></i></button>
    <h1 class="h4 mb-0">Change password</h1><span id="who" class="text-muted small"></span>
  </div>
  <form class="panel" id="f" style="max-width:420px" novalidate>
    <div class="mb-3"><label class="form-label" for="pw">New password (at least 8 characters)</label><input id="pw" type="password" class="form-control" autocomplete="new-password" required></div>
    <div class="mb-3"><label class="form-label" for="pw2">Type it again</label><input id="pw2" type="password" class="form-control" autocomplete="new-password" required></div>
    <button class="btn btn-brand" id="save">Change password</button>
  </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="auth.js"></script><script src="utils.js"></script><script src="layout.js"></script>
<script>
const $ = id => document.getElementById(id);
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  if ($("pw").value.length < 8) return toast("The password must be at least 8 characters.", "error");
  if ($("pw").value !== $("pw2").value) return toast("The two passwords do not match.", "error");
  $("save").disabled = true;
  const { error } = await db.auth.updateUser({ password: $("pw").value });
  $("save").disabled = false;
  if (error) return toast(error.message, "error");
  toast("Password changed."); $("f").reset();
});
(async () => { const me = await requireAuth(); if (!me) return; renderShell("account", me); })();
</script>
</body>
</html>

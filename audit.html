<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit log</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<nav class="sidebar" id="sb" aria-label="Main"></nav>
<main class="main" id="content">
  <div class="topbar">
    <button class="btn btn-outline-secondary d-lg-none" aria-label="Open menu" onclick="sb.classList.toggle('open')"><i class="bi bi-list"></i></button>
    <h1 class="h4 mb-0">Audit log</h1><span id="who" class="text-muted small"></span>
  </div>
  <div class="panel mb-3"><div class="row g-2">
    <div class="col-md-4"><label class="form-label small" for="fu">Person</label><select id="fu" class="form-select"><option value="">Everyone</option></select></div>
    <div class="col-md-4"><label class="form-label small" for="fa">Action</label><select id="fa" class="form-select"><option value="">All actions</option></select></div>
  </div></div>
  <div class="panel"><div class="table-responsive"><table class="table table-sm align-middle">
    <caption class="visually-hidden">Audit log, newest first</caption>
    <thead><tr><th>Date and time</th><th>Person</th><th>Action</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="d-flex justify-content-between align-items-center"><span class="small text-muted" id="count"></span>
    <div class="btn-group"><button class="btn btn-outline-secondary btn-sm" id="prev">Previous</button><button class="btn btn-outline-secondary btn-sm" id="next">Next</button></div></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="auth.js"></script><script src="utils.js"></script><script src="layout.js"></script>
<script>
const $ = id => document.getElementById(id), PAGE = 20; let page = 0;
const ACTIONS = { sale_recorded: "Sale recorded", sale_reversed: "Sale reversed", stock_received: "Stock received", stock_adjustment: "Stock adjustment", customer_payment: "Customer payment", expense_recorded: "Expense recorded", expense_voided: "Expense voided",
  product_insert: "Product added", product_update: "Product changed", staff_approved: "Staff approved", staff_disabled: "Staff disabled", permissions_changed: "Permissions changed" };
const stamp = d => new Intl.DateTimeFormat("en-GB", { timeZone: "Africa/Lagos", dateStyle: "short", timeStyle: "medium" }).format(new Date(d));
const detail = o => Object.entries(o || {}).map(([k, v]) => k.replace(/_/g, " ") + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(", ");
async function load() {
  let q = db.from("audit_logs").select("*, profiles(full_name)", { count: "exact" });
  if ($("fu").value) q = q.eq("user_id", $("fu").value); if ($("fa").value) q = q.eq("action", $("fa").value);
  const { data, count, error } = await q.order("created_at", { ascending: false }).range(page * PAGE, page * PAGE + PAGE - 1);
  if (error) return toast(error.message, "error");
  $("rows").innerHTML = data.map(r => "<tr><td class='text-nowrap'>" + stamp(r.created_at) + "</td><td>" + esc(r.profiles ? r.profiles.full_name : "—") + "</td><td>" + esc(ACTIONS[r.action] || r.action) + "</td><td class='small'>" + esc(detail(r.details)) + "</td></tr>").join("") || '<tr><td colspan="4" class="text-center text-muted py-4">No activity found.</td></tr>';
  $("count").textContent = count ? "Showing " + (page * PAGE + 1) + "-" + Math.min((page + 1) * PAGE, count) + " of " + count : "";
  $("prev").disabled = page === 0; $("next").disabled = (page + 1) * PAGE >= count;
}
const reload = () => { page = 0; load(); };
$("fu").onchange = $("fa").onchange = reload; $("prev").onclick = () => { page--; load(); }; $("next").onclick = () => { page++; load(); };
(async () => {
  const me = await requireAuth("owner"); if (!me) return; renderShell("audit", me);
  $("fa").innerHTML += Object.entries(ACTIONS).map(([k, v]) => '<option value="' + k + '">' + v + "</option>").join("");
  const p = await db.from("profiles").select("id,full_name").order("full_name"); $("fu").innerHTML += (p.data || []).map(x => '<option value="' + x.id + '">' + esc(x.full_name) + "</option>").join(""); load();
})();
</script>
</body>
</html>

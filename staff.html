<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<nav class="sidebar" id="sb" aria-label="Main"></nav>
<main class="main" id="content">
  <div class="topbar">
    <button class="btn btn-outline-secondary d-lg-none" aria-label="Open menu" onclick="sb.classList.toggle('open')"><i class="bi bi-list"></i></button>
    <h1 class="h4 mb-0">Staff</h1><span id="who" class="text-muted small"></span>
  </div>
  <div class="alert alert-info" role="note">To add a staff member: ask them to open the login page and click <strong>Create account</strong>. They appear here as <strong>Pending approval</strong>. Click <strong>Approve</strong> and choose what they may do.</div>
  <div class="panel"><div class="table-responsive"><table class="table align-middle mb-0">
    <caption class="visually-hidden">Staff accounts</caption>
    <thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Can record sales</th><th>Can receive stock</th><th></th></tr></thead>
    <tbody id="rows"></tbody></table></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/utils.js"></script><script src="js/layout.js"></script>
<script>
const $ = id => document.getElementById(id); let people = [], perms = {};
async function load() {
  const [p, q] = await Promise.all([db.from("profiles").select("*").order("created_at"), db.from("staff_permissions").select("*")]);
  if (p.error || q.error) return toast((p.error || q.error).message, "error");
  people = p.data; perms = {}; q.data.forEach(x => perms[x.user_id] = x); draw();
}
function draw() {
  $("rows").innerHTML = people.map(u => {
    if (u.role === "owner") return "<tr><td class='fw-semibold'>" + esc(u.full_name) + "</td><td>" + esc(u.email) + '</td><td><span class="badge text-bg-dark">Owner</span></td><td colspan="3" class="text-muted small">Full access</td></tr>';
    const pm = perms[u.id] || { can_record_sales: true, can_receive_stock: false };
    const st = u.is_active ? '<span class="badge text-bg-success">Active</span>' : '<span class="badge text-bg-warning">Pending approval or disabled</span>';
    const box = (f, on) => '<div class="form-check form-switch"><input class="form-check-input" type="checkbox" data-u="' + u.id + '" data-f="' + f + '"' + (on ? " checked" : "") + ' aria-label="' + f.replace(/_/g, " ") + " for " + esc(u.full_name) + '"></div>';
    return "<tr><td class='fw-semibold'>" + esc(u.full_name) + "</td><td>" + esc(u.email) + "</td><td>" + st + "</td><td>" + box("can_record_sales", pm.can_record_sales) + "</td><td>" + box("can_receive_stock", pm.can_receive_stock) +
      "</td><td class='text-end'><button class='btn btn-sm " + (u.is_active ? "btn-outline-danger" : "btn-brand") + "' data-t='" + u.id + "'>" + (u.is_active ? "Disable" : "Approve") + "</button></td></tr>";
  }).join("");
}
$("rows").addEventListener("change", async e => {
  const c = e.target.closest("[data-f]"); if (!c) return;
  const cur = perms[c.dataset.u] || { can_record_sales: true, can_receive_stock: false };
  const row = { user_id: c.dataset.u, can_record_sales: cur.can_record_sales, can_receive_stock: cur.can_receive_stock }; row[c.dataset.f] = c.checked;
  const { error } = await db.from("staff_permissions").upsert(row, { onConflict: "user_id" });
  if (error) { toast(error.message, "error"); c.checked = !c.checked; return; }
  perms[c.dataset.u] = { ...cur, ...row }; toast("Permission saved.");
});
$("rows").addEventListener("click", async e => {
  const b = e.target.closest("[data-t]"); if (!b) return; const u = people.find(x => x.id === b.dataset.t);
  if (u.is_active && !confirm("Disable " + u.full_name + "? They will no longer be able to sign in.")) return;
  const { error } = await db.from("profiles").update({ is_active: !u.is_active }).eq("id", u.id);
  if (error) return toast(error.message, "error");
  toast(u.is_active ? "Account disabled." : "Account approved."); load();
});
(async () => { const me = await requireAuth("owner"); if (!me) return; renderShell("staff", me); load(); })();
</script>
</body>
</html>
